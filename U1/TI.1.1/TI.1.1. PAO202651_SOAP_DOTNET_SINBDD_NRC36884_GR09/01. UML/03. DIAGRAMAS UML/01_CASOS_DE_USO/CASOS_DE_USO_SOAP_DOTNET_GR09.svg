<style>
text{font-family:Aptos,Segoe UI,Arial,sans-serif;fill:#18324f}.title{font-size:26px;font-weight:700}.sub{font-size:15px;fill:#536579}.boundary{fill:#f8fafc;stroke:#15375b;stroke-width:3}.case{fill:#fff;stroke:#087e8b;stroke-width:2.5}.actor{stroke:#15375b;stroke-width:4;fill:none;stroke-linecap:round}.assoc{stroke:#64748b;stroke-width:2.2;fill:none}.inc{stroke:#64748b;stroke-width:1.8;fill:none;stroke-dasharray:8 6;marker-end:url(#include)}.label{font-size:17px}.small{font-size:14px;fill:#536579}.note{fill:#e8f4f4;stroke:#9ccaca;stroke-width:1.5}

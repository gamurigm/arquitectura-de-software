spring.application.name=WS_ConUni_Java_REST
server.port=8080

# Documentacion OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

# Credenciales en memoria (sin base de datos)
monster.auth.usuario=monster
monster.auth.clave=monster9
monster.token.vigencia-minutos=10

# Respuestas JSON legibles
spring.jackson.serialization.indent-output=true
